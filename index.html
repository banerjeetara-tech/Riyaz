<title>Riyaz</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Hanken+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F0EEF6; --card:#FCFBFF; --ink:#262239; --soft:#6B6580; --line:#E0DCEC;
  --accent:#5C4B8C; --tint:#EBE6F5; --warm:#AE5F5B;
  --serif:'Fraunces',Georgia,serif;
  --sans:'Hanken Grotesk',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  --mono:ui-monospace,'SF Mono',Menlo,Consolas,monospace;
}
body[data-theme="sage"]{--bg:#EDF1EA;--card:#FAFCF8;--ink:#20281F;--soft:#61705C;--line:#DCE4D7;--accent:#456F53;--tint:#E4EDE4;--warm:#A2613B}
body[data-theme="dawn"]{--bg:#F6EFEA;--card:#FFFBF8;--ink:#2E2521;--soft:#7A6A5F;--line:#EADFD5;--accent:#8C5A46;--tint:#F3E6DC;--warm:#5C6E7A}
body[data-theme="night"]{--bg:#191A22;--card:#23242E;--ink:#ECEAF3;--soft:#9A95A8;--line:#33343F;--accent:#9C8BD6;--tint:#2C2C3A;--warm:#D98A80}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.5;overscroll-behavior-y:none}
#app{display:flex;flex-direction:column;height:100dvh;max-width:720px;margin:0 auto}
header{flex:0 0 auto;padding:calc(env(safe-area-inset-top) + 14px) 16px 11px;border-bottom:1px solid var(--line);display:flex;align-items:flex-end;gap:9px}
header h1{font-family:var(--serif);font-weight:600;font-size:24px;margin:0;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header .sub{font-size:12.5px;color:var(--soft);margin:2px 0 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.htitle{flex:1;min-width:0}
.back{background:none;border:none;color:var(--accent);font-size:24px;line-height:1;padding:0 3px 4px 0;cursor:pointer}
.hact{background:none;border:none;font:inherit;font-size:14px;color:var(--accent);cursor:pointer;padding:0 0 6px}
main{flex:1 1 auto;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:15px 16px 28px}
nav{flex:0 0 auto;display:flex;border-top:1px solid var(--line);background:var(--card);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;background:none;border:none;font:inherit;font-size:11px;color:var(--soft);padding:9px 0 11px;cursor:pointer}
nav button .ic{display:block;font-size:18px;line-height:1.4}
nav button.on{color:var(--accent);font-weight:600}
.search{width:100%;padding:11px 15px;border:1px solid var(--line);border-radius:999px;background:var(--card);font:inherit;color:var(--ink);margin-bottom:14px}
.search:focus,input:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:1px}
.filters{display:flex;gap:7px;margin-bottom:14px;overflow-x:auto;padding-bottom:2px}
.chip{border:1px solid var(--line);background:var(--card);color:var(--soft);border-radius:999px;padding:5px 13px;font:inherit;font-size:13px;cursor:pointer;white-space:nowrap}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
.songrow{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:8px;font:inherit;color:inherit;cursor:pointer}
.songrow .ini{flex:0 0 auto;width:38px;height:38px;border-radius:11px;background:var(--tint);color:var(--accent);display:grid;place-items:center;font-family:var(--serif);font-size:17px;font-weight:600}
.songrow .t{flex:1;min-width:0}
.songrow .t b{display:block;font-family:var(--serif);font-size:17px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.songrow .t span{display:block;font-size:12.5px;color:var(--soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.star{font-size:15px;color:var(--warm)}
.rowwrap{position:relative}
.rowwrap .songrow{padding-right:44px}
.dots{position:absolute;right:6px;top:50%;transform:translateY(-50%);background:none;border:none;
  color:var(--soft);font-size:20px;line-height:1;padding:8px 10px;cursor:pointer}
.alpha{font-family:var(--serif);font-size:13px;color:var(--soft);margin:15px 0 6px 4px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:11px}
.chead{display:flex;align-items:baseline;gap:7px;margin-bottom:9px}
.chead h3{font-family:var(--serif);font-size:17.5px;font-weight:600;margin:0;flex:1;min-width:0;cursor:pointer}
.chead .mv{background:none;border:none;color:var(--soft);font-size:15px;cursor:pointer;padding:0 3px}
.chead .tog{background:none;border:none;color:var(--soft);font-size:13px;cursor:pointer;padding:0 6px 0 0;align-self:center}
.folded{font-size:13px;color:var(--soft);margin:0}
#viewer .vpage{display:block;width:100%;height:auto;margin:0 auto 10px}
#viewer .vcount{color:#bbb;font-size:12px;margin-left:auto;font-family:var(--mono)}
#viewer .vnav{display:flex;gap:8px;justify-content:space-between;margin-top:8px}
#chordpop{position:fixed;inset:0;z-index:90;background:rgba(20,18,28,.62);display:grid;place-items:center;padding:20px}
#chordpop .cp{background:var(--card);border-radius:16px;padding:18px;text-align:center;max-width:300px;width:100%}
#chordpop h3{font-family:var(--serif);font-size:24px;margin:0 0 6px}
#chordpop .cpsvg{color:var(--accent);display:flex;justify-content:center;margin-bottom:6px}
.chordcard{display:flex;gap:14px;align-items:center}
.chordcard .cpsvg{color:var(--accent)}
.mini{position:fixed;z-index:200;right:10px;bottom:calc(env(safe-area-inset-bottom) + 84px);width:46vw;max-width:230px;
  background:rgba(22,22,28,.96);border:1px solid #3A3B47;border-radius:12px;overflow:hidden;z-index:8;
  box-shadow:0 10px 30px rgba(0,0,0,.5)}
.mini.s{width:34vw;max-width:170px}
.mini.m{width:52vw;max-width:260px}
.mini.l{width:90vw;max-width:540px}
.mini .mhead{display:flex;align-items:center;gap:5px;padding:6px 7px;background:#1C1C24;cursor:move;touch-action:none;user-select:none}
.mini .mgrip{color:#9A96A8;font-size:11px;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mini .mhead .chip{padding:2px 8px;font-size:11px;background:#2A2A34;border-color:#44454F;color:#ddd}
.mini .mbody{position:relative;padding-bottom:56.25%;height:0;background:#000}
.mini .mbody.audio{padding-bottom:0;height:auto;background:transparent}
.mini .mbody.audio audio{position:static;width:100%;height:36px;margin:6px 0 0}
.mini .mbody iframe,.mini .mbody video{position:absolute;inset:0;width:100%;height:100%;border:0;margin:0;border-radius:0}
.mini .mctl{display:flex;flex-wrap:wrap;gap:4px;padding:6px}
.mini .mctl .chip{padding:3px 9px;font-size:11.5px;background:#2A2A34;border-color:#44454F;color:#eee}
.mini .mctl .chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
.playbar{position:absolute;left:0;right:0;bottom:calc(env(safe-area-inset-bottom) + 96px);
  display:flex;gap:7px;justify-content:center;flex-wrap:wrap;padding:8px 10px;z-index:5}
.playbar .chip{background:rgba(25,25,32,.92);border-color:#44454F;color:#eee}
.playbar .chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
#viewer{position:fixed}
.lrow{display:flex;align-items:center;gap:10px;padding:8px 0}
.lnum{width:20px;font-family:var(--mono);font-size:13px;color:var(--soft);flex:0 0 auto}
.lt{flex:1;min-width:0}
.lt b{display:block;font-size:15.5px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lt span{display:block;font-size:12px;color:var(--soft)}
nav button{font-size:10.5px}
.note{white-space:pre-wrap;font-family:var(--mono);font-size:14px;line-height:1.75;margin:0 0 10px;overflow-x:auto}
.note.blank{font-family:var(--sans);color:var(--soft);font-style:italic}
.note .ch{color:var(--accent);font-weight:600}
.note .sec{color:var(--warm);font-weight:600}
.shot{width:100%;border-radius:10px;display:block;border:1px solid var(--line);margin-bottom:7px}
.zoomwrap{overflow:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--line);border-radius:10px;background:var(--card);margin-bottom:7px;max-height:78vh}

<body>
<div id="app"><header id="hdr"></header><main id="main"></main><nav id="nav"></nav></div>
<div id="toast"></div>
<script>
/* ================= storage ================= */
const mem={};
const HOSTED=!(window.storage&&typeof window.storage.get==='function');
const IDB=(()=>{ let p;
  const open=()=>p||(p=new Promise((res,rej)=>{
    const r=indexedDB.open('riyaz',1);
    r.onupgradeneeded=()=>r.result.createObjectStore('kv');
    r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error);}));
  const run=(mode,fn)=>open().then(db=>new Promise((res,rej)=>{
    const req=fn(db.transaction('kv',mode).objectStore('kv'));
    req.onsuccess=()=>res(req.result); req.onerror=()=>rej(req.error);}));
  return {
    get:k=>run('readonly',s=>s.get(k)),
    set:(k,v)=>run('readwrite',s=>s.put(v,k)),
    del:k=>run('readwrite',s=>s.delete(k))
  };
})();
const S={
  async get(k){
    try{ if(HOSTED){const v=await IDB.get(k);return v===undefined?null:(v??null);}
      const r=await window.storage.get(k);return r?JSON.parse(r.value):(mem[k]??null);
    }catch(e){return mem[k]??null;}
  },
  async set(k,v){
    mem[k]=v;
    try{ if(HOSTED){await IDB.set(k,v);return true;}
      await window.storage.set(k,JSON.stringify(v));return true;
    }catch(e){return false;}
  },
  async del(k){delete mem[k];
    try{ if(HOSTED) await IDB.del(k); else await window.storage.delete(k);}catch(e){}}
};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const toast=m=>{const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('show'),2600);};

/* ================= files ================= */
const MAXB=(HOSTED?200:4.4)*1024*1024, tooBig=d=>d.length*0.75>MAXB;
const readFile=f=>new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=()=>rej(new Error('Could not read that file'));r.readAsDataURL(f);});
function shrink(file,max,q=0.82){return new Promise(async(res,rej)=>{try{
  max=max||(HOSTED?2400:1600);
  const url=await readFile(file),img=new Image();
  img.onload=()=>{const sc=Math.min(1,max/Math.max(img.width,img.height));const c=document.createElement('canvas');
    c.width=Math.round(img.width*sc);c.height=Math.round(img.height*sc);
    c.getContext('2d').drawImage(img,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',q));};
  img.onerror=()=>rej(new Error('Could not open that picture'));img.src=url;}catch(e){rej(e);}});}
const PDFJS='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/';
async function pdfPages(file,scale){
  scale=scale||(HOSTED?2.6:1.9);
  if(!window.pdfjsLib){await new Promise((res,rej)=>{const s=document.createElement('script');s.src=PDFJS+'pdf.min.js';
    s.onload=res;s.onerror=()=>rej(new Error('Could not load the PDF reader. Check your connection.'));document.head.appendChild(s);});
    window.pdfjsLib.GlobalWorkerOptions.workerSrc=PDFJS+'pdf.worker.min.js';}
  const pdf=await window.pdfjsLib.getDocument({data:await file.arrayBuffer()}).promise,out=[];
  for(let p=1;p<=pdf.numPages;p++){const page=await pdf.getPage(p),vp=page.getViewport({scale});
    const c=document.createElement('canvas');c.width=vp.width;c.height=vp.height;
    await page.render({canvasContext:c.getContext('2d'),viewport:vp}).promise;out.push(c.toDataURL('image/jpeg',0.82));}
  return out;
}
const putBlob=(id,data)=>S.set('blob:'+id,{data});
const getBlob=id=>S.get('blob:'+id);
/* media plays badly from a data URL in Safari — no seeking, no looping.
   Hand the player a real blob URL instead. */
const urlCache={};
function mediaURL(id,dataURL){
  if(urlCache[id]) return urlCache[id];
  try{
    const cut=dataURL.indexOf(','), head=dataURL.slice(0,cut), b64=dataURL.slice(cut+1);
    const mime=(head.match(/data:([^;]+)/)||[])[1]||'application/octet-stream';
    const bin=atob(b64), len=bin.length, arr=new Uint8Array(len);
    for(let i=0;i<len;i++) arr[i]=bin.charCodeAt(i);
    const u=URL.createObjectURL(new Blob([arr],{type:mime}));
    urlCache[id]=u; return u;
  }catch(e){ return dataURL; }
}

/* ================= chords: colouring and transposing ================= */
const SH=['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'], FL={Db:'C#',Eb:'D#',Gb:'F#',Ab:'G#',Bb:'A#'};
const CH=/^([A-G](?:#|b)?)((?:maj|min|m|dim|aug|sus|add|M)?[0-9]*(?:sus[0-9])?)(\/[A-G](?:#|b)?)?(\*)?$/;
const isChordLine=l=>{const t=l.trim();if(!t)return false;const p=t.split(/\s+/);return p.length<=12&&p.every(x=>CH.test(x));};
const rootUp=(r,n)=>{const i=SH.indexOf(FL[r]||r);return i<0?r:SH[(i+n%12+12)%12];};
function tLine(line,n){ if(!n) return line;
  return line.replace(/\S+/g,tok=>{const m=tok.match(CH);if(!m)return tok;
    let o=rootUp(m[1],n)+(m[2]||'');if(m[3])o+='/'+rootUp(m[3].slice(1),n);if(m[4])o+='*';
    return o.length<tok.length?o+' '.repeat(tok.length-o.length):o;});}
const transposeText=(t,n)=>t.split('\n').map(l=>isChordLine(l)?tLine(l,n):l).join('\n');
const colourText=t=>t.split('\n').map(l=>/^\s*\[.*\]\s*$/.test(l)?`<span class="sec">${esc(l)}</span>`
  :isChordLine(l)?`<span class="ch">${esc(l)}</span>`:esc(l)).join('\n');

/* ===== ukulele chord shapes, worked out rather than stored ===== */
const OPEN=[7,0,4,9]; /* G C E A */
const NOTE={C:0,'C#':1,Db:1,D:2,'D#':3,Eb:3,E:4,F:5,'F#':6,Gb:6,G:7,'G#':8,Ab:8,A:9,'A#':10,Bb:10,B:11};
const QUAL={'':[0,4,7],maj:[0,4,7],m:[0,3,7],min:[0,3,7],'7':[0,4,7,10],m7:[0,3,7,10],
  maj7:[0,4,7,11],M7:[0,4,7,11],'6':[0,4,7,9],m6:[0,3,7,9],dim:[0,3,6],dim7:[0,3,6,9],
  aug:[0,4,8],sus2:[0,2,7],sus4:[0,5,7],sus:[0,5,7],add9:[0,2,4,7],'9':[0,4,7,10]};
const shapeCache={};
function chordShape(name){
  const key=String(name).replace('*','').trim();
  if(key in shapeCache) return shapeCache[key];
  const m=key.match(/^([A-G](?:#|b)?)(.*)$/);
  let out=null;
  if(m&&NOTE[m[1]]!==undefined){
    const root=NOTE[m[1]], suf=(m[2]||'').split('/')[0].trim(), iv=QUAL[suf];
    if(iv){
      const tones=iv.map(i=>(root+i)%12);
      let best=null;
      for(let a=0;a<=12;a++)for(let b=0;b<=12;b++)for(let c=0;c<=12;c++)for(let d=0;d<=12;d++){
        const f=[a,b,c,d], pcs=f.map((x,i)=>(OPEN[i]+x)%12);
        if(!pcs.every(p=>tones.includes(p))) continue;
        if(!tones.every(t=>pcs.includes(t))) continue;
        const fr=f.filter(x=>x>0);
        const span=fr.length?Math.max(...fr)-Math.min(...fr):0;
        if(span>3) continue;
        const score=Math.max(...f)*4+fr.length+span*2+(pcs.includes(root)?0:9);
        if(!best||score<best.score) best={f,score};
      }
      out=best?best.f:null;
    }
  }
  shapeCache[key]=out; return out;
}
function chordSVG(name){
  const f=chordShape(name);
  if(!f) return '<p class="folded">No shape known for that name.</p>';
  const fr=f.filter(x=>x>0), top=fr.length?Math.max(...fr):0;
  const base=top>4?Math.min(...fr):1;
  const X=[16,40,64,88], Y0=30, GAP=22;
  let g=`<svg viewBox="0 0 104 142" width="104" height="142" role="img" aria-label="${esc(name)} chord">`;
  g+=`<rect x="16" y="${Y0}" width="72" height="${GAP*4}" fill="none" stroke="currentColor" stroke-width="1" opacity=".4"/>`;
  if(base===1) g+=`<rect x="15" y="${Y0-4}" width="74" height="4" fill="currentColor"/>`;
  else g+=`<text x="2" y="${Y0+16}" font-size="11" fill="currentColor" opacity=".7">${base}</text>`;
  for(let i=1;i<3;i++) g+=`<line x1="${X[i]}" y1="${Y0}" x2="${X[i]}" y2="${Y0+GAP*4}" stroke="currentColor" stroke-width="1" opacity=".4"/>`;
  for(let i=1;i<4;i++) g+=`<line x1="16" y1="${Y0+GAP*i}" x2="88" y2="${Y0+GAP*i}" stroke="currentColor" stroke-width="1" opacity=".4"/>`;
  f.forEach((fret,i)=>{
    if(fret===0) g+=`<circle cx="${X[i]}" cy="${Y0-13}" r="4.5" fill="none" stroke="currentColor" stroke-width="1.5"/>`;
    else g+=`<circle cx="${X[i]}" cy="${Y0+(fret-base+0.5)*GAP}" r="8" fill="currentColor"/>`;
  });
  ['G','C','E','A'].forEach((s,i)=>{g+=`<text x="${X[i]}" y="138" font-size="11" text-anchor="middle" fill="currentColor" opacity=".7">${s}</text>`;});
  return g+'</svg>';
}
function showChord(name){
  const v=document.createElement('div');v.id='chordpop';
  v.innerHTML=`<div class="cp"><h3>${esc(name)}</h3><div class="cpsvg">${chordSVG(name)}</div>
    <p class="folded">Strings shown G C E A. A ring means play that string open.</p>
    <div class="btns" style="justify-content:center;margin-top:10px">
      <button class="chip" id="cpmine">My pictures</button>
      <button class="chip" id="cpclose">Close</button></div></div>`;
  document.body.appendChild(v);
  v.onclick=e=>{if(e.target===v)v.remove();};
  v.querySelector('#cpclose').onclick=()=>v.remove();
  v.querySelector('#cpmine').onclick=()=>{v.remove();bookQ=name;go('library');};
}

/* ================= model ================= */
let index=[],song=null,owner=null,screen='songs',filter='all',theme='dusk';
const mkSec=(title,type)=>({id:uid(),title,type,text:'',items:[]});
const newSong=title=>({id:uid(),title,star:false,status:'not started',bpm:'',sections:[
  mkSec('Song sheet','pictures'), mkSec('My scale','pictures'), mkSec('Chords used','notes'),
  mkSec('Strumming pattern','notes'), mkSec('Videos','videos'), mkSec('My recordings','audio'),
  mkSec('Notepad','notes')]});
let books=[],curBook='chords';
async function loadBooks(){
  books=(await S.get('books'))||[{id:'chords',name:'Chords'},{id:'notes',name:'Notes'}];
  await S.set('books',books);
  if(!books.some(b=>b.id===curBook)) curBook=books.length?books[0].id:'';
}
const newBookBody=()=>({sections:[]});
const loadIndex=async()=>{index=(await S.get('index'))||[];};
let cats=[],cat='all';
async function loadCats(){
  cats=(await S.get('cats'))||[{id:uid(),name:'Bengali'},{id:uid(),name:'Hindi'}];
  cats.sort((a,b)=>a.name.localeCompare(b.name,'en',{sensitivity:'base'}));
  await S.set('cats',cats);
}
const catName=id=>{const c=cats.find(x=>x.id===id);return c?c.name:'';};
const hayOf=s=>[s.title,...s.sections.map(x=>x.title),...s.sections.map(x=>x.text||''),
  ...s.sections.flatMap(x=>x.items.map(i=>i.name||''))].join(' ').toLowerCase().slice(0,3000);
async function saveSong(s){
  await S.set('song:'+s.id,s);
  const bits=s.sections.reduce((n,x)=>n+x.items.length,0);
  const row=index.find(r=>r.id===s.id);
  const meta={title:s.title,bits,star:s.star,status:s.status,hay:hayOf(s),seen:s.seen||0,cat:s.cat||''};
  if(row)Object.assign(row,meta); else index.push(Object.assign({id:s.id},meta));
  await S.set('index',index);
}
async function backfillHay(){
  if(!index.some(r=>r.hay===undefined)) return;
  for(const r of index.filter(r=>r.hay===undefined)){
    const s=await S.get('song:'+r.id); if(s) r.hay=hayOf(s);
  }
  await S.set('index',index);
}
/* every distinct chord written anywhere in a song */
function chordsIn(s){
  const found=new Set();
  s.sections.filter(x=>x.type==='notes').forEach(x=>(x.text||'').split('\n').forEach(l=>{
    if(isChordLine(l)) l.trim().split(/\s+/).forEach(t=>found.add(t.replace('*','')));
  }));
  return [...found];
}
const saveOwner=()=>song?saveSong(song):S.set('book:'+curBook,owner);

/* ================= shell ================= */
const hdr=document.getElementById('hdr'),main=document.getElementById('main'),nav=document.getElementById('nav');
function paintNav(){
  nav.innerHTML=[['songs','Songs','♪'],['lists','Lists','☰'],['library','Library','⌗'],['tools','Tools','◎']]
    .map(([k,l,i])=>`<button data-k="${k}" class="${screen===k?'on':''}"><span class="ic">${i}</span>${l}</button>`).join('');
  nav.querySelectorAll('button').forEach(b=>b.onclick=()=>go(b.dataset.k));
}
function go(k){ song=null; screen=k;
  if(k==='songs')viewSongs(); else if(k==='tools')viewTools(); else if(k==='lists')viewLists(); else viewBook();
}
const head=(t,s,back,act)=>{
  hdr.innerHTML=(back?'<button class="back" id="bk" aria-label="Back">‹</button>':'')+
    `<div class="htitle"><h1>${esc(t)}</h1><p class="sub">${esc(s)}</p></div>`+
    (act?`<button class="hact" id="ha">${esc(act.label)}</button>`:'');
  if(back)document.getElementById('bk').onclick=back;
  if(act)document.getElementById('ha').onclick=act.fn;
};

/* ================= songs list ================= */
function viewSongs(){
  song=null;screen='songs';paintNav();
  head('Songs',cat==='all'?'Sorted A to Z':catName(cat)+' · A to Z',null,null);
  main.innerHTML=`<input class="search" id="q" placeholder="Search songs, words, chords">
    <div class="filters">
      <button class="chip ${cat==='all'?'on':''}" data-cat="all">All</button>
      ${cats.map(c=>`<button class="chip ${cat===c.id?'on':''}" data-cat="${c.id}">${esc(c.name)}</button>`).join('')}
      <button class="chip" data-cat="__none">Unsorted</button>
      <button class="chip" id="mc">Edit tabs</button>
    </div>
    <div class="filters">
      ${[['all','Everything'],['recent','Recent'],['star','Favourites'],['not started','Not started'],['practising','Practising'],['learned','Learned']]
        .map(([k,l])=>`<button class="chip ${filter===k?'on':''}" data-f="${k}">${l}</button>`).join('')}
    </div><div id="list"></div>
    <button class="btn wide" id="add" style="margin-top:6px">Add new song</button>`;
  main.querySelectorAll('[data-cat]').forEach(b=>b.onclick=()=>{cat=b.dataset.cat;viewSongs();});
  document.getElementById('mc').onclick=manageCats;
  main.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{filter=b.dataset.f;viewSongs();});
  document.getElementById('q').oninput=e=>paintList(e.target.value);
  document.getElementById('add').onclick=viewAdd;
  backfillHay().then(()=>paintList(document.getElementById('q')?document.getElementById('q').value:''));
  paintList('');
}
function paintList(q){
  const box=document.getElementById('list'); if(!box) return;
  const t=q.trim().toLowerCase();
  let rows=index.filter(r=>cat==='all'||(cat==='__none'?!r.cat:r.cat===cat))
    .filter(r=>!t||r.title.toLowerCase().includes(t)||(r.hay||'').includes(t))
    .filter(r=>filter==='all'||filter==='recent'||(filter==='star'?r.star:r.status===filter));
  rows=filter==='recent'
    ? rows.filter(r=>r.seen).sort((a,b)=>b.seen-a.seen)
    : rows.sort((a,b)=>a.title.localeCompare(b.title,'en',{sensitivity:'base'}));
  if(!rows.length){box.innerHTML=`<div class="blankstate"><h2>${index.length?'Nothing here':'No songs yet'}</h2>
    <p>${index.length?'Try another word, or another filter.':'Tap Add new song and upload the sheet from your sir.'}</p></div>`;return;}
  let letter='',html='';
  for(const r of rows){
    const l=r.title[0].toUpperCase();
    if(l!==letter&&filter==='all'&&!t){letter=l;html+=`<p class="alpha">${esc(letter)}</p>`;}
    const lang=r.cat?catName(r.cat)+' · ':'';
    const where=t&&!r.title.toLowerCase().includes(t)?'found inside this song':lang+(r.status||'not started')+' · '+(r.bits||0)+' item'+(r.bits===1?'':'s');
    html+=`<div class="rowwrap"><button class="songrow" data-id="${r.id}"><span class="ini">${esc(l)}</span>
      <span class="t"><b>${esc(r.title)}</b><span>${esc(where)}</span></span>
      ${r.star?'<span class="star">★</span>':''}</button><button class="dots" data-dots="${r.id}" aria-label="More for ${esc(r.title)}">⋯</button></div>`;

async function intake(files,kind){
  if(!files.length)return;
  const shots=[];
  try{
    for(const f of files){
      toast('Opening '+f.name+'…');
      if(kind==='pdf'){const pages=await pdfPages(f);
        pages.forEach((d,i)=>shots.push({name:f.name.replace(/\.[^.]+$/,'')+(pages.length>1?' — page '+(i+1):''),data:d}));}
      else shots.push({name:f.name.replace(/\.[^.]+$/,''),data:await shrink(f)});
    }
  }catch(err){toast(err.message||'Could not open that file');return;}
  const guess=files[0].name.replace(/\.[^.]+$/,'').replace(/[_-]+/g,' ').replace(/\bchords?\b/ig,'').trim();
  nameIt(newSong(guess),shots);
}
function nameIt(s,shots){

    <p class="hint" style="margin-bottom:16px">${shots.length} page${shots.length===1?'':'s'} go into Song sheet.</p>

  main.querySelectorAll('[data-cc]').forEach(b=>b.onclick=()=>{
    s.cat=b.dataset.cc;
    main.querySelectorAll('[data-cc]').forEach(x=>x.classList.remove('on'));
    b.classList.add('on');});

  };
}

/* results: matching pictures, videos, recordings and lines of writing */
function renderFinds(box,own,raw){
  const q=raw.trim().toLowerCase();
  const exact=n=>{const s=(n||'').toLowerCase();return s===q||s.startsWith(q+' ')||s.startsWith(q+'-')||s.startsWith(q+'_');};
  const hits=[];
  own.sections.forEach(sec=>{
    sec.items.forEach(it=>{
      const n=(it.name||'').toLowerCase();
      if(n.includes(q)) hits.push({sec,it,rank:exact(it.name)?0:1});
    });
    const lines=(sec.text||'').split('\n').filter(l=>l.toLowerCase().includes(q));
    if(lines.length) hits.push({sec,lines,rank:2});
    if((sec.title||'').toLowerCase().includes(q)&&!sec.items.length&&!lines.length) hits.push({sec,rank:3});
  });
  hits.sort((a,b)=>a.rank-b.rank);
  box.innerHTML='';
  const auto=chordShape(raw.trim());
  if(auto){
    const c=document.createElement('section');c.className='card';
    c.innerHTML=`<div class="chordcard"><div class="cpsvg">${chordSVG(raw.trim())}</div>
      <div><h3 style="font-family:var(--serif);font-size:20px;margin:0 0 4px">${esc(raw.trim())}</h3>
      <p class="folded">Worked out for G C E A tuning. Your own pictures, if any, follow below.</p></div></div>`;
    box.appendChild(c);
  }
  if(!hits.length){
    const d=document.createElement('div');d.className='blankstate';
    d.innerHTML=`<h2>${auto?'Nothing of yours yet':'Nothing found'}</h2>
      <p>${auto?'You have not added your own picture for this chord.':'No picture, video or note here matches “'+esc(raw)+'”.'}</p>`;
    box.appendChild(d);return;
  }
  hits.forEach((h,i)=>{
    const card=document.createElement('section');card.className='card';
    card.innerHTML=`<div class="chead"><h3 style="cursor:default">${esc(h.it?h.it.name:h.sec.title)}</h3></div>
      <p class="folded" style="margin-bottom:10px">in ${esc(h.sec.title)}</p><div class="body" id="f${i}"></div>`;
    box.appendChild(card);
    const body=card.querySelector('.body');
    if(h.lines){const p=document.createElement('p');p.className='note';p.innerHTML=colourText(h.lines.join('\n'));body.appendChild(p);}
    else if(h.it) drawFound(body,h.it);
  });
}
async function drawFound(body,it){
  if(it.kind==='yt'){body.innerHTML=ytFrame(it);body.appendChild(ytSpeeds(body.querySelector('iframe')));return;}
  const b=await getBlob(it.id);if(!b){body.innerHTML='<p class="folded">File missing.</p>';return;}
  if(it.kind==='picture'){
    const wrap=document.createElement('div');wrap.className='zoomwrap';
    const im=new Image();im.src=b.data;im.alt=it.name;im.onclick=()=>openViewer(b.data,it.name);
    wrap.appendChild(im);body.append(wrap,zoomRow(im,wrap));
  }else if(it.kind==='clip'){
    const v=document.createElement('video');v.controls=true;v.playsInline=true;v.preload='metadata';
    v.src=mediaURL(it.id,b.data);body.append(v,speeds(v));
  }else{
    const a=document.createElement('audio');a.controls=true;a.preload='metadata';
    a.src=mediaURL(it.id,b.data);body.append(a,speeds(a));
  }
}

function footer(body,s,own,buttons){

  grip.addEventListener('pointerdown',e=>{
    if(e.target.closest('button')) return;

function openViewer(pages,start){
  if(!Array.isArray(pages)) pages=[{src:pages,name:arguments[1]||''}],start=0;
  const v=document.createElement('div');v.id='viewer';
  v.innerHTML=`<div class="vbar">
      <button class="chip" id="vclose">Close</button>
      <button class="chip" id="vplay">▶ video</button>
      <span class="vname" id="vname"></span>
      <span class="vcount" id="vcount"></span>
    </div>
    <div class="vscroll" id="vscroll"></div>
    <div class="vzoom"><div class="speed" id="vz"></div>
      <div class="vnav"><button class="chip" id="vprev">‹ previous</button>
      <button class="chip" id="vauto">auto-scroll</button>
      <button class="chip" id="vnext">next ›</button></div></div>`;
  document.body.appendChild(v);
  const scroll=v.querySelector('#vscroll'),zrow=v.querySelector('#vz');
  const imgs=pages.map(p=>{
    const im=new Image();im.src=p.src;im.alt=p.name||'';im.className='vpage';
    scroll.appendChild(im);return im;
  });
  let mode='fit';
  [['Fit','fit'],['100%',1],['150%',1.5],['200%',2]].forEach(([label,m],i)=>{
    const b=document.createElement('button');b.textContent=label;if(i===0)b.className='on';
    b.onclick=()=>{mode=m;imgs.forEach(im=>applyZoom(im,m));
      zrow.querySelectorAll('button').forEach(x=>x.classList.remove('on'));b.classList.add('on');};
    zrow.appendChild(b);
  });
  imgs.forEach(im=>applyZoom(im,'fit'));
  const nameEl=v.querySelector('#vname'),countEl=v.querySelector('#vcount');
  let at=Math.max(0,Math.min(start||0,pages.length-1));
  const show=i=>{at=Math.max(0,Math.min(i,pages.length-1));
    nameEl.textContent=pages[at].name||'';
    countEl.textContent=pages.length>1?(at+1)+' / '+pages.length:'';
    v.querySelector('#vprev').style.visibility=at>0?'':'hidden';
    v.querySelector('#vnext').style.visibility=at<pages.length-1?'':'hidden';};
  const goTo=i=>{show(i);imgs[at].scrollIntoView({block:'start',behavior:'smooth'});};
  v.querySelector('#vprev').onclick=()=>goTo(at-1);
  v.querySelector('#vnext').onclick=()=>goTo(at+1);
  scroll.onscroll=()=>{
    const top=scroll.scrollTop+40;
    let n=0;for(let i=0;i<imgs.length;i++) if(imgs[i].offsetTop<=top) n=i;
    if(n!==at) show(n);
  };
  v.querySelector('#vclose').onclick=()=>{stopAuto();v.remove();};
  v.querySelector('#vplay').onclick=pickMedia;
  const RATES=[0,26,52,95,160];           /* pixels per second */
  let lvl=0,raf=null,pos=0,last=0;
  const autoBtn=v.querySelector('#vauto');
  function stopAuto(){lvl=0;if(raf)cancelAnimationFrame(raf);raf=null;
    autoBtn.textContent='auto-scroll';autoBtn.classList.remove('on');}
  function step(now){
    if(!lvl){raf=null;return;}
    if(!last) last=now;
    const room=scroll.scrollHeight-scroll.clientHeight;
    if(room<4){last=now;raf=requestAnimationFrame(step);return;}   /* pages still loading */
    pos+=RATES[lvl]*(now-last)/1000;
    last=now;
    scroll.scrollTop=Math.min(pos,room);
    if(pos>=room-1){stopAuto();toast('Reached the end');return;}
    raf=requestAnimationFrame(step);
  }
  autoBtn.onclick=()=>{
    lvl=lvl>=4?0:lvl+1;
    if(!lvl){stopAuto();return;}
    pos=scroll.scrollTop; last=0;
    autoBtn.textContent=['','slow','medium','fast','fastest'][lvl];
    autoBtn.classList.add('on');
    if(!raf) raf=requestAnimationFrame(step);
  };
  scroll.addEventListener('touchstart',()=>{if(lvl){stopAuto();toast('Scrolling stopped');}},{passive:true});
  show(at);
  requestAnimationFrame(()=>{if(imgs[at]) scroll.scrollTop=imgs[at].offsetTop;});
}

function speeds(el){

    const b=document.createElement('button');b.textContent=r+'×';if(r===1)b.className='on';

    a.preload='metadata';a.setAttribute('data-name',it.name||'');a.src=mediaURL(it.id,b.data);
    w.append(a,speeds(a),capFor(it,s));body.insertBefore(w,anchor);});
  const rc=document.createElement('button');rc.className='btn small';rc.textContent='Record';
  const tm=document.createElement('div');tm.className='timer';
  rc.onclick=()=>toggleRec(rc,tm,s);
  const up=document.createElement('label');up.className='file btn ghost small';
  up.innerHTML='Add from files<input type="file" accept="audio/*">';
  up.querySelector('input').onchange=async e=>{
    const f=e.target.files[0];if(!f)return;const d=await readFile(f);
    if(tooBig(d)){toast('That file is too large to store');return;}
    const id=uid();await putBlob(id,d);s.items.push({id,kind:'audio',name:f.name.replace(/\.[^.]+$/,'')});
    await saveOwner();toast('Added');repaint();};
  footer(body,s,own,[rc,up]);body.appendChild(tm);
}
async function toggleRec(btn,tm,s){
  if(rec&&rec.state==='recording'){rec.stop();return;}
  try{
    const stream=await navigator.mediaDevices.getUserMedia({audio:true});
    chunks=[];rec=new MediaRecorder(stream);
    rec.ondataavailable=e=>e.data.size&&chunks.push(e.data);
    rec.onstop=async()=>{
      clearInterval(tick);stream.getTracks().forEach(t=>t.stop());
      const d=await readFile(new Blob(chunks,{type:rec.mimeType||'audio/webm'}));
      if(tooBig(d)){toast('That take was too long to store');repaint();return;}
      const name=prompt('Name this take','Take '+(s.items.length+1));
      if(name===null){toast('Take discarded');repaint();return;}
      const id=uid();await putBlob(id,d);s.items.push({id,kind:'audio',name:name.trim()||'Take'});
      await saveOwner();toast('Take saved');repaint();};
    rec.start();const t0=Date.now();btn.textContent='Stop';btn.classList.add('live');
    tick=setInterval(()=>{const n=Math.floor((Date.now()-t0)/1000);
      tm.textContent=String(Math.floor(n/60)).padStart(2,'0')+':'+String(n%60).padStart(2,'0');},250);
  }catch(e){toast('Mic is blocked here. Record in Voice Memos, then use Add from files.');}
}

/* --- tuner: listens and works out the pitch --- */
let actx=null,tuning=false,tstream=null;
function wireTuner(){
  const btn=document.getElementById('tstart'),nEl=document.getElementById('tn'),hzEl=document.getElementById('thz'),
        needle=document.getElementById('tm'),strip=document.getElementById('ts');
  btn.onclick=async()=>{
    if(tuning){ tuning=false;tstream&&tstream.getTracks().forEach(t=>t.stop());
      btn.textContent='Start tuner';btn.classList.remove('live');nEl.textContent='–';nEl.className='n';
      hzEl.textContent='stopped';needle.style.left='50%';strip.querySelectorAll('span').forEach(s=>s.classList.remove('on'));return;}
    try{
      tstream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false}});
      actx=actx||new (window.AudioContext||window.webkitAudioContext)();
      await actx.resume();
      const src=actx.createMediaStreamSource(tstream),an=actx.createAnalyser();
      an.fftSize=2048;src.connect(an);
      const buf=new Float32Array(an.fftSize);
      tuning=true;btn.textContent='Stop tuner';btn.classList.add('live');
      const NAMES=['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
      const loop=()=>{
        if(!tuning)return;
        an.getFloatTimeDomainData(buf);
        const f=pitch(buf,actx.sampleRate);
        if(f>0){
          const midi=69+12*Math.log2(f/440), near=Math.round(midi), cents=Math.round((midi-near)*100);
          nEl.textContent=NAMES[(near%12+12)%12];
          nEl.className='n'+(Math.abs(cents)<=5?' ok':'');
          hzEl.textContent=f.toFixed(1)+' Hz · '+(cents>0?'+':'')+cents+' cents';
          needle.style.left=Math.max(2,Math.min(98,50+cents/2))+'%';
          const s=NAMES[(near%12+12)%12];
          strip.querySelectorAll('span').forEach(x=>x.classList.toggle('on',x.dataset.s===s));
        }
        requestAnimationFrame(loop);
      };loop();
    }catch(e){ toast('Mic is blocked here. Open the app from your home screen and allow the microphone.'); }
  };
}
function pitch(buf,rate){
  let sum=0;for(let i=0;i<buf.length;i++)sum+=buf[i]*buf[i];
  if(Math.sqrt(sum/buf.length)<0.01)return -1;
  let r1=0,r2=buf.length-1;
  for(let i=0;i<buf.length/2;i++) if(Math.abs(buf[i])<0.002){r1=i;break;}
  for(let i=1;i<buf.length/2;i++) if(Math.abs(buf[buf.length-i])<0.002){r2=buf.length-i;break;}
  const b=buf.slice(r1,r2),n=b.length,c=new Array(n).fill(0);
  for(let l=0;l<n;l++)for(let i=0;i<n-l;i++)c[l]+=b[i]*b[i+l];
  let d=0;while(c[d]>c[d+1])d++;
  let max=-1,pos=-1;
  for(let i=d;i<n;i++) if(c[i]>max){max=c[i];pos=i;}
  if(pos<=0)return -1;
  const y1=c[pos-1],y2=c[pos],y3=c[pos+1],a=(y1+y3-2*y2)/2,bq=(y3-y1)/2;
  const T=a?pos-bq/(2*a):pos;
  const f=rate/T;
  return (f>60&&f<1200)?f:-1;
}
/* --- metronome --- */
let met=null,taps=[];
function wireMetronome(){
  const bEl=document.getElementById('mb'),r=document.getElementById('mr'),
        start=document.getElementById('mstart'),tap=document.getElementById('mtap'),dots=document.getElementById('mbeat');
  r.oninput=()=>{bEl.textContent=r.value;if(met)restart();};
  const restart=()=>{stop();begin();};
  const stop=()=>{if(met){clearInterval(met);met=null;}start.textContent='Start';start.classList.remove('live');
    dots.querySelectorAll('i').forEach(i=>i.classList.remove('on'));};
  const begin=()=>{
    actx=actx||new (window.AudioContext||window.webkitAudioContext)();actx.resume();
    let n=0;const period=60000/ +r.value;
    const click=()=>{
      const o=actx.createOscillator(),g=actx.createGain();
      o.frequency.value=n%4===0?1320:880;
      g.gain.setValueAtTime(0.28,actx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001,actx.currentTime+0.06);
      o.connect(g).connect(actx.destination);o.start();o.stop(actx.currentTime+0.06);
      dots.querySelectorAll('i').forEach((i,k)=>i.classList.toggle('on',k===n%4));
      n++;
    };
    click();met=setInterval(click,period);
    start.textContent='Stop';start.classList.add('live');
  };
  start.onclick=()=>met?stop():begin();
  tap.onclick=()=>{
    const now=Date.now();taps=taps.filter(t=>now-t<3000);taps.push(now);
    if(taps.length>1){
      const gaps=taps.slice(1).map((t,i)=>t-taps[i]);
      const bpm=Math.round(60000/(gaps.reduce((a,b)=>a+b)/gaps.length));
      if(bpm>=40&&bpm<=208){r.value=bpm;bEl.textContent=bpm;if(met)restart();}
    }
  };
}
/* --- backup --- */
async function doExport(full){
  toast(full?'Packing everything…':'Packing…');
  const parts=['{"v":2,"made":'+JSON.stringify(new Date().toISOString())+',"index":'+JSON.stringify(index)+',"songs":['];
  const ids=[]; let first=true;
  for(const r of index){
    const s=await S.get('song:'+r.id); if(!s) continue;
    parts.push((first?'':',')+JSON.stringify(s)); first=false;
    s.sections.forEach(sec=>sec.items.forEach(it=>ids.push(it.id)));
  }
  parts.push('],"booklist":'+JSON.stringify(books)+',"books":{'); first=true;
  for(const k of books.map(b=>b.id)){
    const b=await S.get('book:'+k); if(!b) continue;
    parts.push((first?'':',')+JSON.stringify(k)+':'+JSON.stringify(b)); first=false;
    b.sections.forEach(sec=>sec.items.forEach(it=>ids.push(it.id)));
  }
  parts.push('},"cats":'+JSON.stringify(cats)+',"lists":'+JSON.stringify(await S.get('lists')||null)+',"blobs":{');
  if(full){
    first=true;
    for(const id of ids){
      const b=await getBlob(id); if(!b) continue;
      parts.push((first?'':',')+JSON.stringify(id)+':'+JSON.stringify(b.data)); first=false;
    }
  }
  parts.push('}}');
  const blob=new Blob(parts,{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='riyaz-'+(full?'full-':'words-')+new Date().toISOString().slice(0,10)+'.json';
  a.click();
  toast('Backup saved · '+(blob.size/1048576).toFixed(1)+' MB');
}
async function doImport(e){
  const f=e.target.files[0]; if(!f) return;
  toast('Restoring…');
  try{
    const data=JSON.parse(await f.text());
    if(!data.songs) throw new Error('That is not a Riyaz backup');

    /* files first, so songs that reference them find them */
    let pics=0,picsBad=0;
    for(const [id,d] of Object.entries(data.blobs||{})){
      const ok=await putBlob(id,d); ok?pics++:picsBad++;
    }
    /* tabs and groups */
    if(data.cats){ await S.set('cats',data.cats); }
    if(data.booklist){ await S.set('books',data.booklist); }
    for(const k of Object.keys(data.books||{})) await S.set('book:'+k,data.books[k]);
    if(data.lists) await S.set('lists',data.lists);

    /* songs: always overwrite, then read each one back to be sure */
    const rebuilt=[]; let bad=[];
    for(const sg of data.songs){
      await S.set('song:'+sg.id,sg);
      const check=await S.get('song:'+sg.id);
      if(check&&check.id===sg.id){
        rebuilt.push({id:sg.id,title:sg.title,bits:sg.sections.reduce((n,x)=>n+x.items.length,0),
          star:sg.star,status:sg.status,hay:hayOf(sg),seen:sg.seen||0,cat:sg.cat||''});
      } else bad.push(sg.title);
    }
    /* the list is rebuilt from what really saved, never from the file */
    await S.set('index',rebuilt);
    await loadIndex(); await loadCats(); await loadBooks();

    if(bad.length){
      toast(bad.length+' of '+data.songs.length+' songs could not be saved');
      alert('These could not be saved:\n\n'+bad.slice(0,10).join('\n')+
        (bad.length>10?'\n…and '+(bad.length-10)+' more':''));
    } else if(!Object.keys(data.blobs||{}).length){
      toast(rebuilt.length+' songs restored — words only, no pictures in this file');
    } else {
      toast(rebuilt.length+' songs and '+pics+' files restored'+(picsBad?', '+picsBad+' failed':''));
    }
    viewSongs();
  }catch(err){ toast(err.message||'Could not read that backup'); }
}
async function showSpace(){
  const el=document.getElementById('space'); if(!el) return;
  try{
    const est=await navigator.storage.estimate();
    if(est&&est.usage!=null) el.textContent='Using '+(est.usage/1048576).toFixed(0)+' MB on this device.';
  }catch(e){}
}

  theme=(await S.get('theme'))||'dusk';document.body.dataset.theme=theme;
  await loadIndex();await loadCats();await loadBooks();viewSongs();
})();
